---
title: "Blogpost Corner"
---

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ title }}</title>

  <link rel="stylesheet" href="/styles.css">
</head>

<body>

  <main>
    <h1>BLogpost Corner</h1>

    <p>My little corner of the internet.</p>

    <h2>Posts</h2>

    <ul>
      {% for post in collections.blogPosts reversed %}
        <li>
          <a href="{{ post.url }}">{{ post.data.title }}</a>
        </li>
      {% endfor %}
    </ul>

    <p><a href="/">← Back to the main site</a></p>
  </main>

</body>
</html>
